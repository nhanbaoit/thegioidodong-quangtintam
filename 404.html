<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Không Tìm Thấy Trang - Đồ Đồng Quang Tín Tâm</title>
  <meta http-equiv="refresh" content="3; url=index.html">
  <link rel="stylesheet" href="css/style.css?v=3.0">
  <style>
    body {
      background: #191411;
      color: #fdf5eb;
      font-family: 'Playfair Display', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .error-box {
      max-width: 520px;
      background: #231b15;
      padding: 40px;
      border-radius: 12px;
      border: 1px solid #c88614;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { color: #d4a017; font-size: 32px; margin-bottom: 12px; }
    p { color: #c5b49d; font-size: 15px; line-height: 1.6; }
    .btn-home {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #d49a1d 0%, #a06312 100%);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background: linear-gradient(135deg, #e5a93b 0%, #b87b14 100%);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-box">
    <div style="font-size: 48px; color: #d4a017; margin-bottom: 12px;">❖</div>
    <h1>Trang Không Tồn Tại</h1>
    <p>Trang bạn đang tìm kiếm không tồn tại hoặc đã được thay đổi đường dẫn.<br>Hệ thống sẽ tự động chuyển về trang chủ sau 3 giây...</p>
    <a href="index.html" class="btn-home">Về Trang Chủ Ngay</a>
  </div>
</body>
</html>
